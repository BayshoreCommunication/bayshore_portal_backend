# Reverse proxy for the Bayshore Portal API (Express + Socket.io on 127.0.0.1:5000).
# setup-droplet.sh installs this as its own site and fills in __SERVER_NAME__;
# `certbot --nginx` then adds the TLS server block and the HTTP -> HTTPS redirect.
server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__;

    # Largest single upload the API accepts is a 200 MB video (models/content.model.ts) — with its
    # thumbnail and the form around it. The company portal keeps each request under 180 MB of files
    # (company-portal: MAX_BYTES_PER_REQUEST), a lone big video aside.
    client_max_body_size 260m;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
        proxy_send_timeout 300;
    }
}
