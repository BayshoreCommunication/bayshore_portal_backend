name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      # The droplet is small and shared, so production node_modules are built here
      # and shipped with the release instead of running npm on the server.
      - name: Package release
        if: github.event_name != 'pull_request'
        run: |
          npm prune --omit=dev
          tar -czf release.tgz dist node_modules package.json package-lock.json ecosystem.config.js

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: release
          path: release.tgz
          retention-days: 7

  deploy:
    name: Deploy to droplet
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # One deploy at a time; a second push waits instead of racing the first.
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: deploy

      - uses: actions/download-artifact@v4
        with:
          name: release

      - name: Configure SSH
        env:
          DO_SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          DO_KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DO_SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          printf '%s\n' "$DO_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"

      - name: Upload and release
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          SSH_OPTS=(-i "$HOME/.ssh/deploy_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)
          scp "${SSH_OPTS[@]}" release.tgz "$DO_USER@$DO_HOST:/var/www/bayshoreportal_backend/incoming/$GITHUB_SHA.tgz"
          ssh "${SSH_OPTS[@]}" "$DO_USER@$DO_HOST" "bash -s -- $GITHUB_SHA" < deploy/release.sh
